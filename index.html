<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <div>
      <button id="startAudio">Start Audio</button>
    </div>
    <div>
      <label id="masterFaderLabel" for="masterFader">-60 dBfs</label>
      <input id="masterFader" type="range" min="-60" max="3" />
    </div>
    <div>
      <button id="trigger">Trigger</button>
      <button id="release">Release</button>
    </div>
    <div>
      <lable id="delayLabel" for="delaySlider">Delay: 0</lable>
      <input id="delaySlider" type="range" min="0" max="200" value="0" />
    </div>
    <div>
      <p id="info">Yo</p>
    </div>
  </body>
</html>
